<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Трекер подписок</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #141416);
      --card: var(--tg-theme-secondary-bg-color, #1e1f24);
      --text: var(--tg-theme-text-color, #f2f2f5);
      --hint: var(--tg-theme-hint-color, #8e9099);
      --accent: var(--tg-theme-button-color, #e53935);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-bottom: 14px;
    }
    .tab {
      padding: 8px 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      line-height: 1.2;
    }
    .tab.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: transparent;
    }
    .summary {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .summary-label { font-size: 12px; color: var(--hint); }
    .summary-val { font-size: 20px; font-weight: 700; margin-top: 2px; }
    .btn {
      border: none;
      border-radius: 9px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-text);
    }
    .btn:disabled { opacity: 0.5; cursor: wait; }
    .btn-ghost {
      background: rgba(255,255,255,0.09);
      color: var(--text);
    }
    .btn-cancel {
      background: rgba(255, 255, 255, 0.06);
      color: var(--hint);
      border: 1px solid var(--border);
    }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      transition: opacity 0.2s ease, background 0.2s ease;
    }
    .card.paid {
      opacity: 0.45;
      background: rgba(255, 255, 255, 0.02);
    }
    .card.paid .title-text {
      text-decoration: line-through;
    }
    .title { font-weight: 600; font-size: 15px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .meta { font-size: 12px; color: var(--hint); margin-top: 4px; }
    .badge-paid {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(46, 160, 67, 0.22);
      color: #6ee787;
    }
    .actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 12px; color: var(--hint); margin-bottom: 4px; }
    .field input, .field select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    .periods-box {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .period-chip {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    .period-chip.checked {
      background: rgba(46, 160, 67, 0.25);
      border-color: #2ea043;
      color: #6ee787;
      font-weight: 600;
    }
    .modal-footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
    .status { text-align: center; color: var(--hint); padding: 24px 8px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab" data-tab="current" onclick="switchTab('current')">Эта<br>неделя</button>
    <button class="tab active" data-tab="next" onclick="switchTab('next')">След.<br>неделя</button>
    <button class="tab" data-tab="afterNext" onclick="switchTab('afterNext')">Через<br>неделю</button>
    <button class="tab" data-tab="all" onclick="switchTab('all')">Все</button>
  </div>

  <div class="summary">
    <div>
      <div class="summary-label" id="summaryLabel">Осталось к оплате</div>
      <div class="summary-val" id="summaryAmount">0 ₽</div>
    </div>
    <button class="btn" onclick="openModal()">+ Добавить</button>
  </div>

  <div id="list" class="status">Загрузка...</div>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h3 id="modalTitle" style="margin:0 0 12px 0;font-size:17px;">Новая подписка</h3>
      <input type="hidden" id="editId" />
      <div class="field">
        <label>Название</label>
        <input type="text" id="inpName" placeholder="Например, Яндекс Плюс" />
      </div>
      <div class="field">
        <label>Сумма (₽)</label>
        <input type="number" id="inpAmount" min="0" step="1" placeholder="399" />
      </div>
      <div class="field">
        <label>День месяца (1–31)</label>
        <input type="number" id="inpDay" min="1" max="31" placeholder="20" />
      </div>
      <div class="field">
        <label>Тип оплаты</label>
        <select id="inpType">
          <option value="manual">Пополнять вручную</option>
          <option value="auto">Автопродление</option>
        </select>
      </div>
      <div class="field" id="periodsField" style="display:none;">
        <label>Оплаченные месяцы (нажми, чтобы отметить или отменить)</label>
        <div class="periods-box" id="periodsBox"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm" style="background:#b91c1c;" id="btnDelete" onclick="deleteItem()">Удалить</button>
        <div style="display:flex;gap:8px;margin-left:auto;">
          <button class="btn btn-sm btn-ghost" onclick="closeModal()">Отмена</button>
          <button class="btn btn-sm" onclick="saveItem()">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxObqdvCeLInGOSIOVfgkzxwbmR8Yd54dMYqqZ2HSWje-RcI0T9mCVUrr69-YNfvwlh/exec';
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const MONTH_NAMES = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
    let currentTab = 'next';
    let subscriptions = [];
    let isBusy = false;

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      render();
    }

    function formatPeriod(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function formatPeriodHuman(periodStr) {
      const [y, m] = periodStr.split('-');
      const idx = Number(m) - 1;
      return `${MONTH_NAMES[idx] || m} ${y}`;
    }

    function getEffectiveDate(year, monthIndex, day) {
      const lastDay = new Date(year, monthIndex + 1, 0).getDate();
      return new Date(year, monthIndex, Math.min(Number(day) || 1, lastDay));
    }

    function getWeekRange(offsetWeeks) {
      const now = new Date();
      const dow = now.getDay();
      const daysUntilMon = dow === 0 ? 1 : (8 - dow);
      const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysUntilMon + offsetWeeks * 7);
      const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
      return { start: mon, end: sun };
    }

    function getItemsForRange(start, end) {
      const months = [{ y: start.getFullYear(), m: start.getMonth() }];
      if (start.getFullYear() !== end.getFullYear() || start.getMonth() !== end.getMonth()) {
        months.push({ y: end.getFullYear(), m: end.getMonth() });
      }
      const res = [];
      subscriptions.filter(s => s.active).forEach(sub => {
        const paidList = Array.isArray(sub.paid_periods) ? sub.paid_periods : [];
        months.forEach(ym => {
          const dt = getEffectiveDate(ym.y, ym.m, sub.day);
          if (dt >= start && dt <= end) {
            const period = formatPeriod(dt);
            res.push({ ...sub, date: dt, period, isPaid: paidList.includes(period) });
          }
        });
      });
      res.sort((a, b) => a.date - b.date);
      return res;
    }

    function fmtDate(d) {
      return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function render() {
      const listEl = document.getElementById('list');
      const labelEl = document.getElementById('summaryLabel');
      const amtEl = document.getElementById('summaryAmount');

      let rows = [];
      if (currentTab === 'current') {
        const r = getWeekRange(-1);
        labelEl.textContent = `Эта неделя (${fmtDate(r.start)}–${fmtDate(r.end)})`;
        rows = getItemsForRange(r.start, r.end);
      } else if (currentTab === 'next') {
        const r = getWeekRange(0);
        labelEl.textContent = `След. неделя (${fmtDate(r.start)}–${fmtDate(r.end)})`;
        rows = getItemsForRange(r.start, r.end);
      } else if (currentTab === 'afterNext') {
        const r = getWeekRange(1);
        labelEl.textContent = `Через неделю (${fmtDate(r.start)}–${fmtDate(r.end)})`;
        rows = getItemsForRange(r.start, r.end);
      } else {
        const now = new Date();
        const curPeriod = formatPeriod(now);
        labelEl.textContent = 'Все активные (в месяц)';
        rows = subscriptions.filter(s => s.active).map(s => {
          const paidList = Array.isArray(s.paid_periods) ? s.paid_periods : [];
          return {
            ...s,
            date: null,
            period: curPeriod,
            isPaid: paidList.includes(curPeriod),
            paidList
          };
        });
      }

      const unpaidSum = rows.filter(x => !x.isPaid).reduce((acc, x) => acc + Number(x.amount || 0), 0);
      amtEl.textContent = `${unpaidSum} ₽`;

      if (!rows.length) {
        listEl.innerHTML = '<div class="status">В этом разделе пока пусто</div>';
        return;
      }

      listEl.className = '';
      listEl.innerHTML = rows.map(item => {
        const whenStr = item.date ? `${fmtDate(item.date)} · ` : '';
        const typeStr = item.pay_type === 'auto' ? 'авто' : 'вручную';
        const paidBadge = item.isPaid
          ? `<span class="badge-paid">✓ Оплачено (${formatPeriodHuman(item.period)})</span>`
          : '';
        const extraPaidInfo = (currentTab === 'all' && item.paidList && item.paidList.length > 0)
          ? `<div class="meta" style="color:#6ee787;">Закрыто: ${item.paidList.map(formatPeriodHuman).join(', ')}</div>`
          : '';

        return `
          <div class="card ${item.isPaid ? 'paid' : ''}">
            <div>
              <div class="title">
                <span class="title-text">${escapeHtml(item.name)}</span>
                ${paidBadge}
              </div>
              <div class="meta">${whenStr}${item.amount} ₽ · ${item.day}-е число · ${typeStr}</div>
              ${extraPaidInfo}
            </div>
            <div class="actions">
              <button class="btn btn-sm ${item.isPaid ? 'btn-cancel' : 'btn-ghost'}" ${isBusy ? 'disabled' : ''} onclick="togglePaid('${item.id}', '${item.period}')">
                ${item.isPaid ? 'Отменить' : 'Оплачено'}
              </button>
              <button class="btn btn-sm btn-ghost" ${isBusy ? 'disabled' : ''} onclick="openModal('${item.id}')">✎</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function apiCall(action, params = {}) {
      isBusy = true;
      render();
      try {
        const query = new URLSearchParams({ action, ...params, _t: Date.now() });
        const resp = await fetch(`${API_URL}?${query.toString()}`, { method: 'GET' });
        const json = await resp.json();
        if (!json.ok) throw new Error(json.error || 'API error');
        subscriptions = json.data || [];
      } finally {
        isBusy = false;
        render();
      }
    }

    async function loadData() {
      try {
        await apiCall('list');
      } catch (e) {
        document.getElementById('list').innerHTML = `<div class="status">Ошибка загрузки: ${escapeHtml(e.message)}</div>`;
      }
    }

    async function togglePaid(id, period) {
      try {
        await apiCall('togglePaid', { id, period });
      } catch (e) {
        alert('Ошибка: ' + e.message);
      }
    }

    function renderPeriodsInModal(item) {
      const box = document.getElementById('periodsBox');
      const now = new Date();
      const paidList = Array.isArray(item.paid_periods) ? item.paid_periods : [];
      const chips = [];
      for (let offset = 0; offset < 3; offset++) {
        const d = new Date(now.getFullYear(), now.getMonth() + offset, 1);
        const p = formatPeriod(d);
        const checked = paidList.includes(p);
        chips.push(`
          <button type="button" class="period-chip ${checked ? 'checked' : ''}" onclick="togglePeriodInModal('${item.id}', '${p}')">
            ${checked ? '✓ ' : ''}${formatPeriodHuman(p)}
          </button>
        `);
      }
      box.innerHTML = chips.join('');
    }

    async function togglePeriodInModal(id, period) {
      await togglePaid(id, period);
      const updated = subscriptions.find(x => String(x.id) === String(id));
      if (updated) renderPeriodsInModal(updated);
    }

    function openModal(id = null) {
      const modal = document.getElementById('modal');
      const delBtn = document.getElementById('btnDelete');
      const periodsField = document.getElementById('periodsField');

      if (id) {
        const item = subscriptions.find(x => String(x.id) === String(id));
        if (!item) return;
        document.getElementById('modalTitle').textContent = 'Редактировать подписку';
        document.getElementById('editId').value = item.id;
        document.getElementById('inpName').value = item.name;
        document.getElementById('inpAmount').value = item.amount;
        document.getElementById('inpDay').value = item.day;
        document.getElementById('inpType').value = item.pay_type;
        delBtn.style.display = 'inline-block';
        periodsField.style.display = 'block';
        renderPeriodsInModal(item);
      } else {
        document.getElementById('modalTitle').textContent = 'Новая подписка';
        document.getElementById('editId').value = '';
        document.getElementById('inpName').value = '';
        document.getElementById('inpAmount').value = '';
        document.getElementById('inpDay').value = '';
        document.getElementById('inpType').value = 'manual';
        delBtn.style.display = 'none';
        periodsField.style.display = 'none';
      }
      modal.classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    async function saveItem() {
      const id = document.getElementById('editId').value;
      const name = document.getElementById('inpName').value.trim();
      const amount = Number(document.getElementById('inpAmount').value);
      const day = Number(document.getElementById('inpDay').value);
      const pay_type = document.getElementById('inpType').value;

      if (!name || !day || day < 1 || day > 31) {
        alert('Проверь название и день месяца (от 1 до 31)');
        return;
      }

      closeModal();
      try {
        if (id) {
          await apiCall('update', { id, name, amount, day, pay_type });
        } else {
          await apiCall('add', { name, amount, day, pay_type });
        }
      } catch (e) {
        alert('Ошибка сохранения: ' + e.message);
      }
    }

    async function deleteItem() {
      const id = document.getElementById('editId').value;
      if (!id) return;
      closeModal();
      try {
        await apiCall('delete', { id });
      } catch (e) {
        alert('Ошибка удаления: ' + e.message);
      }
    }

    loadData();
  </script>
</body>
</html>
